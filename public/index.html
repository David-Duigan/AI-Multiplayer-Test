<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fake Artist - Online Multiplayer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }

    .container { background: var(--card); width: 100%; max-width: 850px; border-radius: 12px; padding: 1.5rem; position: relative; }
    .screen { display: none; flex-direction: column; gap: 1rem; }
    .screen.active { display: flex; }

    input, button { padding: 0.75rem; border-radius: 6px; border: none; font-size: 1rem; }
    input { background: #334155; color: var(--text); border: 1px solid #475569; }
    button { background: var(--accent); color: white; cursor: pointer; font-weight: bold; }
    button.secondary { background: #475569; }

    .player-badge { background: #334155; padding: 0.5rem 1rem; border-radius: 6px; display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    
    .canvas-wrapper { position: relative; border: 2px solid #475569; border-radius: 8px; overflow: hidden; background: #fff; width: 100%; display: flex; justify-content: center; }
    canvas { display: block; cursor: crosshair; }

    .toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--danger); color: white; padding: 0.4rem 1rem; border-radius: 20px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .flash-error { animation: flash 0.4s ease; }
    @keyframes flash { 50% { border-color: var(--danger); box-shadow: 0 0 15px var(--danger); } }

    .vote-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; }
    .role-banner { font-size: 1.2rem; font-weight: bold; text-align: center; padding: 0.5rem; border-radius: 6px; background: #334155; }
  </style>
</head>
<body>

<div class="container">

  <!-- LOBBY SCREEN -->
  <div id="lobby-screen" class="screen active">
    <h1 style="text-align: center;">Fake Artist Online</h1>
    <div style="display: flex; gap: 0.5rem;">
      <input type="text" id="player-name" placeholder="Your Name" style="flex:1;" />
      <input type="text" id="room-id" placeholder="Room Code" style="width: 120px;" value="ROOM1" />
      <button id="join-btn">Join Game</button>
    </div>

    <div id="lobby-waiting" style="display: none; flex-direction: column; gap: 1rem;">
      <h3>Players in Room:</h3>
      <div id="player-list"></div>
      <button id="start-btn" style="display: none;">Start Game (Min 3 Players)</button>
    </div>
  </div>

  <!-- GAMEPLAY SCREEN -->
  <div id="game-screen" class="screen">
    <div class="role-banner" id="role-banner">Secret Word: Loading...</div>
    <div style="text-align: center; font-size: 1.1rem; color: #38bdf8;" id="turn-indicator">Waiting for turn...</div>

    <div class="canvas-wrapper" id="canvas-wrapper">
      <div id="toast" class="toast">Line too short! Min length is 50px.</div>
      <canvas id="paint-canvas" width="700" height="450"></canvas>
    </div>

    <div style="display: flex; gap: 1rem; justify-content: center; background: #334155; padding: 0.5rem; border-radius: 6px;">
      <label>Color: <input type="color" id="stroke-color" value="#ef4444" /></label>
      <label>Size: <input type="range" id="stroke-width" min="2" max="20" value="6" /></label>
    </div>
  </div>

  <!-- VOTING SCREEN -->
  <div id="vote-screen" class="screen">
    <h2 style="text-align: center;">Voting Session</h2>
    <p style="text-align: center; color: var(--subtext);" id="vote-status">Vote for the Imposter!</p>
    <div class="vote-grid" id="vote-grid"></div>
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="gameover-screen" class="screen" style="text-align: center;">
    <h1 id="gameover-title">Game Over</h1>
    <p id="gameover-msg" style="font-size: 1.2rem; margin: 1rem 0;"></p>
    <button onclick="location.reload()">Return to Lobby</button>
  </div>

</div>

<script>
  // Replace window.location.origin with your Render Backend URL if hosted separately
  const socket = io(window.location.origin);

  let myId = null;
  let currentTurnPlayerId = null;
  let isDrawing = false;
  let strokePoints = [];
  const MIN_LINE_LENGTH = 50;

  // DOM Elements
  const lobbyScreen = document.getElementById('lobby-screen');
  const gameScreen = document.getElementById('game-screen');
  const voteScreen = document.getElementById('vote-screen');
  const gameoverScreen = document.getElementById('gameover-screen');

  const canvas = document.getElementById('paint-canvas');
  const ctx = canvas.getContext('2d');
  const canvasWrapper = document.getElementById('canvas-wrapper');
  const toast = document.getElementById('toast');

  socket.on('connect', () => { myId = socket.id; });

  // --- LOBBY ACTIONS ---
  document.getElementById('join-btn').onclick = () => {
    const playerName = document.getElementById('player-name').value.trim();
    const roomId = document.getElementById('room-id').value.trim();
    if (!playerName || !roomId) return;

    socket.emit('join_room', { roomId, playerName });
    document.getElementById('lobby-waiting').style.display = 'flex';
  };

  document.getElementById('start-btn').onclick = () => {
    socket.emit('start_game');
  };

  socket.on('room_updated', (room) => {
    const list = document.getElementById('player-list');
    list.innerHTML = '';
    room.players.forEach(p => {
      list.innerHTML += `<div class="player-badge"><span>${p.name}</span></div>`;
    });

    // Room Host control (first joined player controls start button)
    const isHost = room.players[0] && room.players[0].id === myId;
    const startBtn = document.getElementById('start-btn');
    startBtn.style.display = isHost ? 'block' : 'none';
    startBtn.disabled = room.players.length < 3;
  });

  // --- ROLE & GAME START ---
  socket.on('role_assignment', ({ role, word }) => {
    const banner = document.getElementById('role-banner');
    if (role === 'IMPOSTER') {
      banner.innerText = "You are the IMPOSTER! Try to blend in.";
      banner.style.color = "var(--danger)";
    } else {
      banner.innerText = `Secret Word: ${word}`;
      banner.style.color = "#38bdf8";
    }
  });

  socket.on('game_started', (roomState) => {
    lobbyScreen.classList.remove('active');
    gameScreen.classList.add('active');

    // Clear canvas
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    updateTurnUI(roomState.currentTurnPlayerId);
  });

  socket.on('turn_changed', ({ currentTurnPlayerId, currentTurnName }) => {
    updateTurnUI(currentTurnPlayerId, currentTurnName);
  });

  function updateTurnUI(playerId, playerName) {
    currentTurnPlayerId = playerId;
    const indicator = document.getElementById('turn-indicator');
    if (playerId === myId) {
      indicator.innerText = "YOUR TURN! Draw one line.";
      indicator.style.color = "#22c55e";
    } else {
      indicator.innerText = `${playerName || 'Another player'}'s turn to draw...`;
      indicator.style.color = "#38bdf8";
    }
  }

  // --- CANVAS DRAWING ---
  canvas.addEventListener('mousedown', (e) => {
    if (currentTurnPlayerId !== myId) return;
    isDrawing = true;
    strokePoints = [getCoords(e)];
    ctx.beginPath();
    ctx.strokeStyle = document.getElementById('stroke-color').value;
    ctx.lineWidth = document.getElementById('stroke-width').value;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.moveTo(strokePoints[0].x, strokePoints[0].y);
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    const pt = getCoords(e);
    strokePoints.push(pt);
    ctx.lineTo(pt.x, pt.y);
    ctx.stroke();
  });

  canvas.addEventListener('mouseup', endStroke);
  canvas.addEventListener('mouseleave', endStroke);

  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function endStroke() {
    if (!isDrawing) return;
    isDrawing = false;

    // Length check
    let length = 0;
    for (let i = 1; i < strokePoints.length; i++) {
      const dx = strokePoints[i].x - strokePoints[i - 1].x;
      const dy = strokePoints[i].y - strokePoints[i - 1].y;
      length += Math.sqrt(dx * dx + dy * dy);
    }

    if (length < MIN_LINE_LENGTH) {
      // Invalid stroke: reset canvas visually and alert
      canvasWrapper.classList.add('flash-error');
      toast.classList.add('show');
      setTimeout(() => {
        canvasWrapper.classList.remove('flash-error');
        toast.classList.remove('show');
      }, 1200);
    } else {
      // Emit valid stroke to server
      socket.emit('submit_stroke', {
        points: strokePoints,
        color: document.getElementById('stroke-color').value,
        width: document.getElementById('stroke-width').value
      });
    }
  }

  // Sync Stroke from other players
  socket.on('draw_stroke', (data) => {
    ctx.beginPath();
    ctx.strokeStyle = data.color;
    ctx.lineWidth = data.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.moveTo(data.points[0].x, data.points[0].y);

    for (let i = 1; i < data.points.length; i++) {
      ctx.lineTo(data.points[i].x, data.points[i].y);
    }
    ctx.stroke();
  });

  // --- VOTING PHASE ---
  socket.on('start_voting', ({ alivePlayers }) => {
    gameScreen.classList.remove('active');
    voteScreen.classList.add('active');

    const grid = document.getElementById('vote-grid');
    grid.innerHTML = '';

    alivePlayers.forEach(p => {
      if (p.id !== myId) {
        const btn = document.createElement('button');
        btn.innerText = `Vote ${p.name}`;
        btn.onclick = () => castVote(p.id);
        grid.appendChild(btn);
      }
    });

    const skipBtn = document.createElement('button');
    skipBtn.className = 'secondary';
    skipBtn.innerText = 'Skip Vote';
    skipBtn.onclick = () => castVote('SKIP');
    grid.appendChild(skipBtn);
  });

  function castVote(targetId) {
    socket.emit('submit_vote', { targetId });
    document.getElementById('vote-grid').innerHTML = '<p style="text-align:center;">Vote submitted. Waiting for other players...</p>';
  }

  socket.on('vote_progress', ({ votedCount, totalCount }) => {
    document.getElementById('vote-status').innerText = `Votes gathered: ${votedCount} / ${totalCount}`;
  });

  socket.on('vote_result', ({ message }) => {
    alert(message);
  });

  socket.on('next_round', ({ currentTurnPlayerId, currentTurnName }) => {
    voteScreen.classList.remove('active');
    gameScreen.classList.add('active');
    updateTurnUI(currentTurnPlayerId, currentTurnName);
  });

  socket.on('game_over', ({ winner, message }) => {
    voteScreen.classList.remove('active');
    gameScreen.classList.remove('active');
    gameoverScreen.classList.add('active');

    const title = document.getElementById('gameover-title');
    title.innerText = winner === 'IMPOSTER' ? 'Imposter Wins!' : 'Artists Win!';
    title.style.color = winner === 'IMPOSTER' ? 'var(--danger)' : '#38bdf8';
    document.getElementById('gameover-msg').innerText = message;
  });
</script>

</body>
</html>
