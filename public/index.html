<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER ARENA: OVERDRIVE</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #050608; color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }

        #ui-overlay {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 100;
            background: rgba(12, 16, 26, 0.85);
            padding: 12px 24px; border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        input {
            background: #0a0d14; color: #00f0ff;
            border: 1px solid #1e293b; padding: 10px 16px;
            border-radius: 6px; font-size: 16px; outline: none;
            text-transform: uppercase; font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            color: #000; font-weight: 800; border: none;
            padding: 10px 20px; border-radius: 6px; font-size: 15px;
            cursor: pointer; transition: all 0.2s ease;
        }

        #scoreboard {
            position: absolute; top: 20px; right: 20px; z-index: 90;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px; border-radius: 10px; backdrop-filter: blur(8px);
        }

        .score-row { display: flex; justify-content: space-between; font-weight: bold; margin-top: 6px; font-size: 14px; gap: 15px;}

        #crosshair {
            position: absolute; width: 22px; height: 22px;
            border: 2px solid #00f0ff; border-radius: 50%;
            pointer-events: none; transform: translate(-50%, -50%);
            z-index: 200; box-shadow: 0 0 12px #00f0ff;
        }

        canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
    </style>
</head>
<body>

<div id="crosshair"></div>

<div id="ui-overlay">
    <input type="text" id="roomInput" placeholder="ROOM CODE" value="MATCH1" />
    <button onclick="joinRoom()">JOIN MATCH</button>
</div>

<div id="scoreboard">
    <div style="font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 5px; color: #888;">ARENA MATCH</div>
    <div id="scores"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');

    let myId = null;
    let localPlayer = { x: 0, y: 0, angle: 0 };
    let serverPlayers = {};
    let interpolatedPlayers = {};
    let localBullets = [];
    let serverBullets = [];
    let powerups = [];
    let obstacles = [];
    let particles = [];
    let keys = {};
    let mouse = { x: 0, y: 0 };
    let lastDash = 0;
    let screenShake = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        crosshair.style.left = `${e.clientX}px`;
        crosshair.style.top = `${e.clientY}px`;
    });

    // Spawn locally FIRST, then emit to server
    window.addEventListener('mousedown', () => {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;

        const p = serverPlayers[myId];
        const angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);
        const speed = 20;
        const newBullets = [];

        const isTriple = p.tripleTimer > Date.now();
        const angles = isTriple ? [angle - 0.2, angle, angle + 0.2] : [angle];

        angles.forEach(a => {
            const bullet = {
                id: Math.random().toString(36).substring(2, 9),
                x: localPlayer.x + Math.cos(a) * 30,
                y: localPlayer.y + Math.sin(a) * 30,
                vx: Math.cos(a) * speed,
                vy: Math.sin(a) * speed,
                color: p.color,
                life: 80
            };
            localBullets.push(bullet);
            newBullets.push(bullet);
        });

        // Notify server to replicate for opponent screens
        socket.emit('spawnLocalBullets', { bullets: newBullets });
        screenShake = 3;
    });

    function joinRoom() {
        const room = document.getElementById('roomInput').value.trim().toUpperCase();
        if (room) {
            socket.emit('joinGame', room);
            document.getElementById('ui-overlay').style.opacity = '0.3';
        }
    }

    socket.on('initPlayer', (data) => {
        myId = data.id;
        obstacles = data.obstacles;
    });

    socket.on('roomState', (data) => {
        serverPlayers = data.players;
        if (myId && serverPlayers[myId] && localPlayer.x === 0 && localPlayer.y === 0) {
            localPlayer.x = serverPlayers[myId].x;
            localPlayer.y = serverPlayers[myId].y;
        }
        updateScoreboard();
    });

    socket.on('respawnPlayer', (data) => {
        if (data.id === myId) {
            localPlayer.x = data.x;
            localPlayer.y = data.y;
        }
    });

    socket.on('impactEvent', (data) => {
        screenShake = 8;
        for (let i = 0; i < 12; i++) {
            particles.push({
                x: data.x, y: data.y,
                vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                life: 20, color: data.color
            });
        }
    });

    socket.on('serverState', (data) => {
        serverPlayers = data.players;
        serverBullets = data.bullets;
        powerups = data.powerups;

        Object.keys(serverPlayers).forEach(id => {
            if (!interpolatedPlayers[id]) interpolatedPlayers[id] = { ...serverPlayers[id] };
        });

        updateScoreboard();
    });

    setInterval(() => {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;
        socket.emit('playerTransform', {
            x: localPlayer.x,
            y: localPlayer.y,
            angle: localPlayer.angle
        });
    }, 1000 / 60);

    function updateLocalPlayer() {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;

        const p = serverPlayers[myId];
        let speed = p.speedTimer > Date.now() ? 9 : 5.5;

        if (keys['shift'] && Date.now() - lastDash > 1000) {
            speed = 28;
            lastDash = Date.now();
        }

        let nextX = localPlayer.x;
        let nextY = localPlayer.y;

        if (keys['w'] || keys['arrowup']) nextY -= speed;
        if (keys['s'] || keys['arrowdown']) nextY += speed;
        if (keys['a'] || keys['arrowleft']) nextX -= speed;
        if (keys['d'] || keys['arrowright']) nextX += speed;

        // Obstacle Collisions with Local Player
        obstacles.forEach(obs => {
            if (Math.hypot(nextX - obs.x, nextY - obs.y) < obs.r + 20) {
                const angle = Math.atan2(nextY - obs.y, nextX - obs.x);
                nextX = obs.x + Math.cos(angle) * (obs.r + 20);
                nextY = obs.y + Math.sin(angle) * (obs.r + 20);
            }
        });

        localPlayer.x = Math.max(30, Math.min(canvas.width - 30, nextX));
        localPlayer.y = Math.max(30, Math.min(canvas.height - 30, nextY));
        localPlayer.angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);
    }

    function updateLocalBullets() {
        for (let i = localBullets.length - 1; i >= 0; i--) {
            let b = localBullets[i];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;

            let hitObstacle = false;
            obstacles.forEach(obs => {
                if (Math.hypot(obs.x - b.x, obs.y - b.y) < obs.r) hitObstacle = true;
            });

            if (hitObstacle || b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                localBullets.splice(i, 1);
            }
        }
    }

    function updateOpponents() {
        const lerpFactor = 0.35;
        Object.keys(serverPlayers).forEach(id => {
            if (id !== myId && interpolatedPlayers[id]) {
                const target = serverPlayers[id];
                const curr = interpolatedPlayers[id];

                curr.x += (target.x - curr.x) * lerpFactor;
                curr.y += (target.y - curr.y) * lerpFactor;
                curr.angle = target.angle;
                curr.hp = target.hp;
                curr.color = target.color;
                curr.shieldTimer = target.shieldTimer;
                curr.speedTimer = target.speedTimer;
            }
        });
    }

    function drawSpaceship(x, y, angle, color, hp, shieldActive, speedActive) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.fillStyle = speedActive ? '#00f0ff' : '#ff5500';
        ctx.beginPath();
        ctx.moveTo(-22, -6);
        ctx.lineTo(-32 - Math.random() * 10, 0);
        ctx.lineTo(-22, 6);
        ctx.fill();

        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(25, 0);
        ctx.lineTo(-18, -18);
        ctx.lineTo(-10, 0);
        ctx.lineTo(-18, 18);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        if (shieldActive) {
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, 32, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (hp > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x - 25, y - 35, 50, 6);
            ctx.fillStyle = color;
            ctx.fillRect(x - 25, y - 35, (hp / 100) * 50, 6);
        }
    }

    function render() {
        ctx.save();

        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.88;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid Background
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 60) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Draw Obstacles
        obstacles.forEach(obs => {
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        });

        // Draw Power-Ups
        powerups.forEach(p => {
            let col = p.type === 'TRIPLE' ? '#ffcc00' : (p.type === 'SPEED' ? '#00ff66' : '#00f0ff');
            ctx.fillStyle = col;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Remote Bullets
        serverBullets.forEach(b => {
            if (b.owner !== myId) {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Draw Local Instant Bullets
        localBullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
            ctx.fill();
        });

        // Render Opponents
        Object.keys(interpolatedPlayers).forEach(id => {
            if (id !== myId) {
                const p = interpolatedPlayers[id];
                if (p.hp > 0) {
                    drawSpaceship(p.x, p.y, p.angle, p.color, p.hp, p.shieldTimer > Date.now(), p.speedTimer > Date.now());
                }
            }
        });

        // Render Local Player
        if (myId && serverPlayers[myId] && serverPlayers[myId].hp > 0) {
            const p = serverPlayers[myId];
            drawSpaceship(localPlayer.x, localPlayer.y, localPlayer.angle, p.color, p.hp, p.shieldTimer > Date.now(), p.speedTimer > Date.now());
        }

        ctx.restore();
    }

    function updateScoreboard() {
        const container = document.getElementById('scores');
        container.innerHTML = '';
        Object.values(serverPlayers).forEach((p, idx) => {
            const row = document.createElement('div');
            row.className = 'score-row';
            row.style.color = p.color;
            row.innerHTML = `<span>PILOT ${idx + 1}</span> <span>${p.kills} K / ${p.deaths} D</span>`;
            container.appendChild(row);
        });
    }

    function loop() {
        updateLocalPlayer();
        updateLocalBullets();
        updateOpponents();
        render();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
