<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER ARENA: OVERDRIVE</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #050608; color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        #ui-overlay {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 100;
            background: rgba(12, 16, 26, 0.85);
            padding: 12px 24px; border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        input {
            background: #0a0d14; color: #00f0ff;
            border: 1px solid #1e293b; padding: 10px 16px;
            border-radius: 6px; font-size: 16px; outline: none;
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            color: #000; font-weight: 800; border: none;
            padding: 10px 20px; border-radius: 6px; font-size: 15px;
            cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        #scoreboard {
            position: absolute; top: 20px; right: 20px; z-index: 90;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px; border-radius: 10px;
            backdrop-filter: blur(8px); min-width: 180px;
        }

        .score-row {
            display: flex; justify-content: space-between;
            font-weight: bold; margin-top: 6px; font-size: 14px;
        }

        #crosshair {
            position: absolute; width: 22px; height: 22px;
            border: 2px solid #00f0ff; border-radius: 50%;
            pointer-events: none; transform: translate(-50%, -50%);
            z-index: 200; box-shadow: 0 0 12px #00f0ff;
        }

        canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
    </style>
</head>
<body>

<div id="crosshair"></div>

<div id="ui-overlay">
    <input type="text" id="roomInput" placeholder="ROOM CODE" value="MATCH1" />
    <button onclick="joinRoom()">JOIN MATCH</button>
    <button onclick="toggleFullscreen()">FULLSCREEN 🖵</button>
</div>

<div id="scoreboard">
    <div style="font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 5px; color: #888;">ARENA MATCH</div>
    <div id="scores"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');

    let myId = null;
    let localPlayer = { x: 0, y: 0, angle: 0, hp: 100 };
    let serverPlayers = {};
    let interpolatedPlayers = {};
    let bullets = [];
    let powerups = [];
    let particles = [];
    let hazardAngle = 0;
    let keys = {};
    let mouse = { x: 0, y: 0 };
    let lastDash = 0;
    let screenShake = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        crosshair.style.left = `${e.clientX}px`;
        crosshair.style.top = `${e.clientY}px`;
    });

    // Local-Origin Shoot Dispatch
    window.addEventListener('mousedown', () => {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;
        
        const angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);

        // Send local position as the spawn origin
        socket.emit('requestShoot', {
            originX: localPlayer.x,
            originY: localPlayer.y,
            angle: angle,
            isTriple: serverPlayers[myId].tripleTimer > Date.now()
        });

        screenShake = 3;
    });

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    function joinRoom() {
        const room = document.getElementById('roomInput').value.trim().toUpperCase();
        if (room) {
            socket.emit('joinGame', room);
            document.getElementById('ui-overlay').style.opacity = '0.3';
        }
    }

    socket.on('initPlayer', (data) => myId = data.id);

    socket.on('roomState', (data) => {
        serverPlayers = data.players;
        if (myId && serverPlayers[myId] && localPlayer.x === 0 && localPlayer.y === 0) {
            localPlayer.x = serverPlayers[myId].x;
            localPlayer.y = serverPlayers[myId].y;
        }
        updateScoreboard();
    });

    socket.on('respawnPlayer', (data) => {
        if (data.id === myId) {
            localPlayer.x = data.x;
            localPlayer.y = data.y;
        }
    });

    socket.on('impactEvent', (data) => {
        screenShake = 8;
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: data.x, y: data.y,
                vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
                life: 20, color: data.color
            });
        }
    });

    socket.on('serverState', (data) => {
        serverPlayers = data.players;
        bullets = data.bullets;
        powerups = data.powerups;
        hazardAngle = data.hazardAngle;

        Object.keys(serverPlayers).forEach(id => {
            if (!interpolatedPlayers[id]) {
                interpolatedPlayers[id] = { ...serverPlayers[id] };
            }
        });

        updateScoreboard();
    });

    // Send high-rate local movement
    setInterval(() => {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;
        socket.emit('playerTransform', {
            x: localPlayer.x,
            y: localPlayer.y,
            angle: localPlayer.angle
        });
    }, 1000 / 60);

    function updateLocalPlayer() {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;

        const p = serverPlayers[myId];
        let speed = p.speedTimer > Date.now() ? 10 : 6;

        if (keys['shift'] && Date.now() - lastDash > 1000) {
            speed = 32;
            lastDash = Date.now();

            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: localPlayer.x, y: localPlayer.y,
                    vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                    life: 15, color: p.color
                });
            }
        }

        if (keys['w'] || keys['arrowup']) localPlayer.y -= speed;
        if (keys['s'] || keys['arrowdown']) localPlayer.y += speed;
        if (keys['a'] || keys['arrowleft']) localPlayer.x -= speed;
        if (keys['d'] || keys['arrowright']) localPlayer.x += speed;

        localPlayer.x = Math.max(30, Math.min(canvas.width - 30, localPlayer.x));
        localPlayer.y = Math.max(30, Math.min(canvas.height - 30, localPlayer.y));
        localPlayer.angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);
    }

    function updateOpponents() {
        const lerpFactor = 0.35;
        Object.keys(serverPlayers).forEach(id => {
            if (id !== myId && interpolatedPlayers[id]) {
                const target = serverPlayers[id];
                const curr = interpolatedPlayers[id];

                curr.x += (target.x - curr.x) * lerpFactor;
                curr.y += (target.y - curr.y) * lerpFactor;
                curr.angle = target.angle;
                curr.hp = target.hp;
                curr.color = target.color;
                curr.shieldTimer = target.shieldTimer;
                curr.speedTimer = target.speedTimer;
            }
        });
    }

    function drawSpaceship(x, y, angle, color, hp, shieldActive, speedActive) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // Thruster flame
        ctx.fillStyle = speedActive ? '#00f0ff' : '#ff5500';
        ctx.beginPath();
        ctx.moveTo(-22, -6);
        ctx.lineTo(-32 - Math.random() * (speedActive ? 16 : 8), 0);
        ctx.lineTo(-22, 6);
        ctx.fill();

        // Ship hull
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 14;

        ctx.beginPath();
        ctx.moveTo(25, 0);
        ctx.lineTo(-18, -18);
        ctx.lineTo(-10, 0);
        ctx.lineTo(-18, 18);
        ctx.closePath();
        ctx.fill();

        // Cockpit
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(4, 0, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Shield Aura
        if (shieldActive) {
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(x, y, 32, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Health Bar
        if (hp > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x - 25, y - 35, 50, 6);
            ctx.fillStyle = color;
            ctx.fillRect(x - 25, y - 35, (hp / 100) * 50, 6);
        }
    }

    function render() {
        ctx.save();

        // Camera Shake
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.9;
            if (screenShake < 0.5) screenShake = 0;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid Background
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 60) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Central Rotating Hazard
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(hazardAngle);
        ctx.strokeStyle = 'rgba(255, 0, 85, 0.6)';
        ctx.lineWidth = 8;
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(-150, 0);
        ctx.lineTo(150, 0);
        ctx.stroke();
        ctx.restore();

        // Render Power-Ups
        powerups.forEach(p => {
            ctx.shadowBlur = 15;
            let col = '#00f0ff';
            if (p.type === 'TRIPLE') col = '#ffcc00';
            if (p.type === 'SPEED') col = '#00ff66';

            ctx.fillStyle = col;
            ctx.shadowColor = col;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.font = '900 12px sans-serif';
            ctx.fillText(p.type[0], p.x - 4, p.y + 4);
        });

        // Render Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let part = particles[i];
            part.x += part.vx;
            part.y += part.vy;
            part.life--;
            ctx.fillStyle = part.color;
            ctx.beginPath();
            ctx.arc(part.x, part.y, 3, 0, Math.PI * 2);
            ctx.fill();
            if (part.life <= 0) particles.splice(i, 1);
        }

        // Render Bullets
        bullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
            ctx.fill();
        });

        // Render Opponents
        Object.keys(interpolatedPlayers).forEach(id => {
            if (id !== myId) {
                const p = interpolatedPlayers[id];
                if (p.hp > 0) {
                    drawSpaceship(p.x, p.y, p.angle, p.color, p.hp, p.shieldTimer > Date.now(), p.speedTimer > Date.now());
                }
            }
        });

        // Render Local Player
        if (myId && serverPlayers[myId] && serverPlayers[myId].hp > 0) {
            const p = serverPlayers[myId];
            drawSpaceship(localPlayer.x, localPlayer.y, localPlayer.angle, p.color, p.hp, p.shieldTimer > Date.now(), p.speedTimer > Date.now());
        }

        ctx.restore();
    }

    function updateScoreboard() {
        const container = document.getElementById('scores');
        container.innerHTML = '';
        Object.values(serverPlayers).forEach((p, idx) => {
            const row = document.createElement('div');
            row.className = 'score-row';
            row.style.color = p.color;
            row.innerHTML = `<span>PILOT ${idx + 1}</span> <span>${p.kills} K / ${p.deaths} D</span>`;
            container.appendChild(row);
        });
    }

    function loop() {
        updateLocalPlayer();
        updateOpponents();
        render();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
