<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER ARENA: OVERDRIVE</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background: #050608; color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        #ui-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 100;
            background: rgba(12, 16, 26, 0.85); padding: 12px 24px; border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3); backdrop-filter: blur(10px);
        }
        input {
            background: #0a0d14; color: #00f0ff; border: 1px solid #1e293b;
            padding: 10px 16px; border-radius: 6px; font-size: 16px; outline: none;
            text-transform: uppercase; font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000;
            font-weight: 800; border: none; padding: 10px 20px; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease;
        }
        #scoreboard {
            position: absolute; top: 20px; right: 20px; z-index: 90;
            background: rgba(10, 14, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px; border-radius: 10px; min-width: 180px;
        }
        .score-row { display: flex; justify-content: space-between; font-weight: bold; margin-top: 6px; }
        #crosshair {
            position: absolute; width: 22px; height: 22px; border: 2px solid #00f0ff;
            border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
            z-index: 200; box-shadow: 0 0 12px #00f0ff;
        }
        canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
    </style>
</head>
<body>

<div id="crosshair"></div>
<div id="ui-overlay">
    <input type="text" id="roomInput" placeholder="ROOM CODE" value="MATCH1" />
    <button onclick="joinRoom()">JOIN MATCH</button>
</div>

<div id="scoreboard">
    <div style="font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 5px; color: #888;">ARENA MATCH</div>
    <div id="scores"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');

    let myId = null;
    let localPlayer = { x: 0, y: 0, angle: 0 };
    let serverPlayers = {};
    let interpolatedPlayers = {};
    let activeBullets = {}; // Rendered bullet map synced live with server
    let powerups = [];
    let obstacles = [];
    let particles = [];
    let hazardAngle = 0;
    let keys = {};
    let mouse = { x: 0, y: 0 };
    let screenShake = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        crosshair.style.left = `${e.clientX}px`;
        crosshair.style.top = `${e.clientY}px`;
    });

    // Spawn locally instantly, then rely purely on server positions
    window.addEventListener('mousedown', () => {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;

        const p = serverPlayers[myId];
        const angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);
        const speed = 22;
        const isTriple = p.tripleTimer > Date.now();

        const angles = isTriple ? [angle - 0.2, angle, angle + 0.2] : [angle];

        angles.forEach(a => {
            const bulletId = Math.random().toString(36).substr(2, 9);
            const bulletData = {
                id: bulletId,
                owner: myId,
                x: localPlayer.x + Math.cos(a) * 30,
                y: localPlayer.y + Math.sin(a) * 30,
                vx: Math.cos(a) * speed,
                vy: Math.sin(a) * speed,
                color: p.color
            };

            // 1. Instantly store locally so it appears frame 1 at the local ship tip
            activeBullets[bulletId] = bulletData;

            // 2. Notify server to take over bullet trajectory and sync to all players
            socket.emit('spawnBullet', bulletData);
        });

        screenShake = 3;
    });

    function joinRoom() {
        const room = document.getElementById('roomInput').value.trim().toUpperCase();
        if (room) socket.emit('joinGame', room);
    }

    socket.on('initPlayer', (data) => myId = data.id);

    socket.on('roomState', (data) => {
        serverPlayers = data.players;
        obstacles = data.obstacles || [];
        if (myId && serverPlayers[myId] && localPlayer.x === 0) {
            localPlayer.x = serverPlayers[myId].x;
            localPlayer.y = serverPlayers[myId].y;
        }
        updateScoreboard();
    });

    socket.on('respawnPlayer', (data) => {
        if (data.id === myId) {
            localPlayer.x = data.x;
            localPlayer.y = data.y;
        }
    });

    socket.on('impactEvent', (data) => {
        screenShake = 6;
        for (let i = 0; i < 10; i++) {
            particles.push({
                x: data.x, y: data.y,
                vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                life: 15, color: data.color
            });
        }
    });

    // Receive live server-driven position updates for ALL bullets
    socket.on('serverState', (data) => {
        serverPlayers = data.players;
        powerups = data.powerups;
        obstacles = data.obstacles;
        hazardAngle = data.hazardAngle;

        // Overwrite active bullets with official server live positions
        activeBullets = data.bullets || {};

        Object.keys(serverPlayers).forEach(id => {
            if (!interpolatedPlayers[id]) interpolatedPlayers[id] = { ...serverPlayers[id] };
        });

        updateScoreboard();
    });

    setInterval(() => {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;
        socket.emit('playerTransform', {
            x: localPlayer.x,
            y: localPlayer.y,
            angle: localPlayer.angle
        });
    }, 1000 / 60);

    function updateLocalPlayer() {
        if (!myId || !serverPlayers[myId] || serverPlayers[myId].hp <= 0) return;

        const p = serverPlayers[myId];
        let speed = p.speedTimer > Date.now() ? 9 : 5.5;

        let nextX = localPlayer.x;
        let nextY = localPlayer.y;

        if (keys['w'] || keys['arrowup']) nextY -= speed;
        if (keys['s'] || keys['arrowdown']) nextY += speed;
        if (keys['a'] || keys['arrowleft']) nextX -= speed;
        if (keys['d'] || keys['arrowright']) nextX += speed;

        obstacles.forEach(obs => {
            if (obs.hp > 0) {
                const dist = Math.hypot(nextX - obs.x, nextY - obs.y);
                if (dist < obs.r + 20) {
                    const angle = Math.atan2(nextY - obs.y, nextX - obs.x);
                    nextX = obs.x + Math.cos(angle) * (obs.r + 20);
                    nextY = obs.y + Math.sin(angle) * (obs.r + 20);
                }
            }
        });

        localPlayer.x = Math.max(30, Math.min(canvas.width - 30, nextX));
        localPlayer.y = Math.max(30, Math.min(canvas.height - 30, nextY));
        localPlayer.angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);
    }

    function drawSpaceship(x, y, angle, color, hp, shieldActive, speedActive) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.fillStyle = speedActive ? '#00f0ff' : '#ff5500';
        ctx.beginPath();
        ctx.moveTo(-20, -5); ctx.lineTo(-30 - Math.random() * 10, 0); ctx.lineTo(-20, 5);
        ctx.fill();

        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(22, 0); ctx.lineTo(-16, -16); ctx.lineTo(-8, 0); ctx.lineTo(-16, 16);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        if (shieldActive) {
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, 28, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (hp > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x - 25, y - 32, 50, 5);
            ctx.fillStyle = color;
            ctx.fillRect(x - 25, y - 32, (hp / 100) * 50, 5);
        }
    }

    function render() {
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.85;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid Background
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.3)';
        for (let x = 0; x < canvas.width; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 60) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Obstacles
        obstacles.forEach(obs => {
            if (obs.hp > 0) {
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(obs.x - 20, obs.y - obs.r - 12, 40, 4);
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(obs.x - 20, obs.y - obs.r - 12, (obs.hp / obs.maxHp) * 40, 4);
            }
        });

        // Power-Ups
        powerups.forEach(p => {
            ctx.fillStyle = p.type === 'TRIPLE' ? '#ffcc00' : p.type === 'SPEED' ? '#00ff66' : '#00f0ff';
            ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2); ctx.fill();
        });

        // Particles
        particles.forEach((part, i) => {
            part.x += part.vx; part.y += part.vy; part.life--;
            ctx.fillStyle = part.color;
            ctx.beginPath(); ctx.arc(part.x, part.y, 3, 0, Math.PI * 2); ctx.fill();
            if (part.life <= 0) particles.splice(i, 1);
        });

        // Render Server-Synced Bullets
        Object.values(activeBullets).forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
        });

        // Opponents
        Object.keys(interpolatedPlayers).forEach(id => {
            if (id !== myId) {
                const p = interpolatedPlayers[id];
                const curr = interpolatedPlayers[id];
                const target = serverPlayers[id];
                if (target) {
                    curr.x += (target.x - curr.x) * 0.3;
                    curr.y += (target.y - curr.y) * 0.3;
                    if (p.hp > 0) drawSpaceship(curr.x, curr.y, target.angle, target.color, target.hp, target.shieldTimer > Date.now(), target.speedTimer > Date.now());
                }
            }
        });

        // Local Player
        if (myId && serverPlayers[myId] && serverPlayers[myId].hp > 0) {
            const p = serverPlayers[myId];
            drawSpaceship(localPlayer.x, localPlayer.y, localPlayer.angle, p.color, p.hp, p.shieldTimer > Date.now(), p.speedTimer > Date.now());
        }

        ctx.restore();
    }

    function updateScoreboard() {
        const container = document.getElementById('scores');
        container.innerHTML = '';
        Object.values(serverPlayers).forEach((p, idx) => {
            const row = document.createElement('div');
            row.className = 'score-row';
            row.style.color = p.color;
            row.innerHTML = `<span>PILOT ${idx + 1}</span> <span>${p.kills} K / ${p.deaths} D</span>`;
            container.appendChild(row);
        });
    }

    function loop() {
        updateLocalPlayer();
        render();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
