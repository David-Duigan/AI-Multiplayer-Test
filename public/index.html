<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER ARENA: OVERDRIVE</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #050608;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            background: rgba(12, 16, 26, 0.85);
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        input {
            background: #0a0d14;
            color: #00f0ff;
            border: 1px solid #1e293b;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        button {
            background: linear-gradient(135deg, #00f0ff, #0088ff);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }

        #scoreboard {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 90;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            min-width: 180px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-top: 6px;
            font-size: 14px;
        }

        #crosshair {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 200;
            box-shadow: 0 0 10px #00f0ff;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: none;
        }
    </style>
</head>
<body>

<div id="crosshair"></div>

<div id="ui-overlay">
    <input type="text" id="roomInput" placeholder="ROOM CODE" value="MATCH1" />
    <button onclick="joinRoom()">JOIN MATCH</button>
    <button onclick="toggleFullscreen()">FULLSCREEN 🖵</button>
</div>

<div id="scoreboard">
    <div style="font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 5px; color: #888;">ARENA MATCH</div>
    <div id="scores"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');

    let myId = null;
    let mySlot = 0;
    let players = {};
    let bullets = [];
    let particles = [];
    let keys = {};
    let mouse = { x: 0, y: 0 };

    // Canvas Resizing
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Controls
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        crosshair.style.left = `${e.clientX}px`;
        crosshair.style.top = `${e.clientY}px`;
    });

    window.addEventListener('mousedown', () => {
        if (!myId || !players[myId] || players[myId].hp <= 0) return;
        const p = players[myId];
        const angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

        const bullet = {
            id: Math.random().toString(),
            owner: myId,
            x: p.x + Math.cos(angle) * 30,
            y: p.y + Math.sin(angle) * 30,
            vx: Math.cos(angle) * 16,
            vy: Math.sin(angle) * 16,
            color: p.color
        };

        bullets.push(bullet);
        socket.emit('spawnBullet', bullet);
    });

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    function joinRoom() {
        const room = document.getElementById('roomInput').value.trim().toUpperCase();
        if (room) {
            socket.emit('joinGame', room);
            document.getElementById('ui-overlay').style.opacity = '0.3';
        }
    }

    socket.on('initPlayer', (data) => {
        myId = data.id;
        mySlot = data.slot;
        players[myId] = data.player;
    });

    socket.on('playerJoined', (data) => {
        players = data.players;
        updateScoreboard();
    });

    socket.on('opponentState', (data) => {
        if (players[data.id]) {
            players[data.id].x = data.x;
            players[data.id].y = data.y;
            players[data.id].angle = data.angle;
            players[data.id].hp = data.hp;
        }
    });

    socket.on('bulletSpawned', (b) => bullets.push(b));

    socket.on('applyDamage', (data) => {
        if (data.victimId === myId) {
            const p = players[myId];
            p.hp -= data.damage;
            if (p.hp <= 0) {
                p.deaths++;
                p.hp = 0;
                setTimeout(() => {
                    p.hp = 100;
                    p.x = 200 + Math.random() * (canvas.width - 400);
                    p.y = 200 + Math.random() * (canvas.height - 400);
                }, 2500);
            }
        }
        if (data.attackerId === myId && data.killed) {
            players[myId].kills++;
        }
        updateScoreboard();
    });

    socket.on('playerLeft', (id) => {
        delete players[id];
        updateScoreboard();
    });

    // Local Physics & Movement (Immediate Input Execution)
    let lastDash = 0;
    function updateLocalPlayer() {
        if (!myId || !players[myId] || players[myId].hp <= 0) return;

        const p = players[myId];
        let speed = 6;

        if (keys['shift'] && Date.now() - lastDash > 1200) {
            speed = 35; // Dash Burst
            lastDash = Date.now();

            // Dash Particle Trail
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: p.x, y: p.y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 20, color: p.color
                });
            }
        }

        if (keys['w'] || keys['arrowup']) p.y -= speed;
        if (keys['s'] || keys['arrowdown']) p.y += speed;
        if (keys['a'] || keys['arrowleft']) p.x -= speed;
        if (keys['d'] || keys['arrowright']) p.x += speed;

        p.x = Math.max(30, Math.min(canvas.width - 30, p.x));
        p.y = Math.max(30, Math.min(canvas.height - 30, p.y));

        p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);

        // Send state to opponents
        socket.emit('updateState', {
            x: p.x, y: p.y, angle: p.angle, hp: p.hp, kills: p.kills, deaths: p.deaths
        });
    }

    function updateBullets() {
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;

            // Thruster particle for bullet
            if (Math.random() > 0.5) {
                particles.push({
                    x: b.x, y: b.y,
                    vx: -b.vx * 0.1, vy: -b.vy * 0.1,
                    life: 10, color: b.color
                });
            }

            // Hit Detection (Checked locally by bullet owner)
            if (b.owner === myId) {
                Object.keys(players).forEach(otherId => {
                    if (otherId !== myId) {
                        const target = players[otherId];
                        if (target.hp > 0 && Math.hypot(target.x - b.x, target.y - b.y) < 25) {
                            const killed = (target.hp - 25) <= 0;
                            socket.emit('playerHit', { victimId: otherId, attackerId: myId, damage: 25, killed });
                            bullets.splice(i, 1);
                        }
                    }
                });
            }

            if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                bullets.splice(i, 1);
            }
        }
    }

    function drawSpaceship(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // Engine Thruster Flame
        ctx.fillStyle = '#ff5500';
        ctx.beginPath();
        ctx.moveTo(-22, -6);
        ctx.lineTo(-32 - Math.random() * 10, 0);
        ctx.lineTo(-22, 6);
        ctx.fill();

        // Ship Wings & Frame
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.moveTo(25, 0); // Nose
        ctx.lineTo(-18, -18); // Left wing
        ctx.lineTo(-10, 0); // Center rear
        ctx.lineTo(-18, 18); // Right wing
        ctx.closePath();
        ctx.fill();

        // Cockpit Glass
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(4, 0, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Health Bar & Name
        if (p.hp > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(p.x - 25, p.y - 35, 50, 6);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - 25, p.y - 35, (p.hp / 100) * 50, 6);
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dynamic Space Grid Pattern
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.4)';
        ctx.lineWidth = 1;
        const gridSize = 60;
        for (let x = 0; x < canvas.width; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Render Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let part = particles[i];
            part.x += part.vx;
            part.y += part.vy;
            part.life--;
            ctx.fillStyle = part.color;
            ctx.beginPath();
            ctx.arc(part.x, part.y, 3, 0, Math.PI * 2);
            ctx.fill();
            if (part.life <= 0) particles.splice(i, 1);
        }

        // Render Bullets
        bullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
            ctx.fill();
        });

        // Render All Players
        Object.values(players).forEach(p => {
            if (p.hp > 0) drawSpaceship(p);
        });

        ctx.shadowBlur = 0;
    }

    function updateScoreboard() {
        const container = document.getElementById('scores');
        container.innerHTML = '';
        Object.values(players).forEach((p, idx) => {
            const row = document.createElement('div');
            row.className = 'score-row';
            row.style.color = p.color;
            row.innerHTML = `<span>PILOT ${idx + 1}</span> <span>${p.kills} K / ${p.deaths} D</span>`;
            container.appendChild(row);
        });
    }

    function loop() {
        updateLocalPlayer();
        updateBullets();
        render();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
