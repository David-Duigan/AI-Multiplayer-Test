<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER ARENA: HIGH-PERFORMANCE NETCODE</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background: #050608; color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        #ui-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 100;
            background: rgba(12, 16, 26, 0.85); padding: 12px 24px; border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3); backdrop-filter: blur(10px);
        }
        input {
            background: #0a0d14; color: #00f0ff; border: 1px solid #1e293b;
            padding: 10px 16px; border-radius: 6px; font-size: 16px; outline: none;
            text-transform: uppercase; font-weight: bold;
        }
        button {
            background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000;
            font-weight: 800; border: none; padding: 10px 20px; border-radius: 6px;
            cursor: pointer; transition: all 0.2s ease;
        }
        #scoreboard {
            position: absolute; top: 20px; right: 20px; z-index: 90;
            background: rgba(10, 14, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px; border-radius: 10px; min-width: 180px;
        }
        .score-row { display: flex; justify-content: space-between; font-weight: bold; margin-top: 6px; }
        #crosshair {
            position: absolute; width: 22px; height: 22px; border: 2px solid #00f0ff;
            border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
            z-index: 200; box-shadow: 0 0 12px #00f0ff;
        }
        canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
    </style>
</head>
<body>

<div id="crosshair"></div>
<div id="ui-overlay">
    <input type="text" id="roomInput" placeholder="ROOM CODE" value="ARENA1" />
    <button onclick="joinRoom()">JOIN MATCH</button>
</div>

<div id="scoreboard">
    <div style="font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 5px; color: #888;">ARENA MATCH</div>
    <div id="scores"></div>
</div>

<canvas id="gameCanvas"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');

    let myId = null;
    let localPlayer = { x: 0, y: 0, angle: 0 };
    let inputSequence = 0;
    let pendingInputs = [];

    // Entity Interpolation Snapshots Buffer
    let stateBuffer = [];
    const INTERPOLATION_OFFSET_MS = 50;

    let localBullets = {}; // Local independent simulation for bullets
    let powerups = [];
    let obstacles = [];
    let particles = [];
    let keys = {};
    let mouse = { x: 0, y: 0 };
    let screenShake = 0;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        crosshair.style.left = `${e.clientX}px`;
        crosshair.style.top = `${e.clientY}px`;
    });

    // Fire Bullets with Instant Client-Side Physics Simulation
    window.addEventListener('mousedown', () => {
        const latestState = getLatestServerPlayerState(myId);
        if (!myId || !latestState || latestState.hp <= 0) return;

        const angle = Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x);
        const speed = 22;
        const isTriple = latestState.tripleTimer > Date.now();

        const angles = isTriple ? [angle - 0.2, angle, angle + 0.2] : [angle];

        angles.forEach(a => {
            const bulletId = Math.random().toString(36).substr(2, 9);
            const bulletData = {
                id: bulletId,
                owner: myId,
                x: localPlayer.x + Math.cos(a) * 30,
                y: localPlayer.y + Math.sin(a) * 30,
                vx: Math.cos(a) * speed,
                vy: Math.sin(a) * speed,
                color: latestState.color,
                life: 80
            };

            // Local simulation store
            localBullets[bulletId] = bulletData;

            // Notify server to initiate authoritative trajectory & hit detection
            socket.emit('spawnBullet', bulletData);
        });

        screenShake = 3;
    });

    function joinRoom() {
        const room = document.getElementById('roomInput').value.trim().toUpperCase();
        if (room) socket.emit('joinGame', room);
    }

    socket.on('initPlayer', (data) => myId = data.id);

    socket.on('roomState', (data) => {
        obstacles = data.obstacles || [];
    });

    socket.on('respawnPlayer', (data) => {
        if (data.id === myId) {
            localPlayer.x = data.x;
            localPlayer.y = data.y;
            pendingInputs = [];
        }
    });

    socket.on('impactEvent', (data) => {
        delete localBullets[data.id]; // Remove visual bullet immediately on impact
        screenShake = 6;
        for (let i = 0; i < 10; i++) {
            particles.push({
                x: data.x, y: data.y,
                vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                life: 15, color: data.color
            });
        }
    });

    // Receive Server Snapshot for Interpolation and Reconciliation
    socket.on('serverState', (data) => {
        stateBuffer.push(data);
        if (stateBuffer.length > 20) stateBuffer.shift();

        powerups = data.powerups;
        obstacles = data.obstacles;

        const serverMe = data.players[myId];
        if (serverMe) {
            // Client Reconciliation: Re-apply pending local inputs on top of last confirmed server state
            localPlayer.x = serverMe.x;
            localPlayer.y = serverMe.y;

            pendingInputs = pendingInputs.filter(input => input.seq > serverMe.lastProcessedSeq);
            pendingInputs.forEach(input => applyInputToLocalPlayer(input));
        }

        // Synchronize remote bullets fired by opponents into local simulation
        Object.keys(data.bullets).forEach(id => {
            const b = data.bullets[id];
            if (b.owner !== myId) {
                localBullets[id] = { ...b };
            }
        });

        updateScoreboard(data.players);
    });

    function applyInputToLocalPlayer(input) {
        const latestState = getLatestServerPlayerState(myId);
        let speed = (latestState && latestState.speedTimer > Date.now()) ? 9 : 5.5;

        let nextX = localPlayer.x;
        let nextY = localPlayer.y;

        if (input.up) nextY -= speed;
        if (input.down) nextY += speed;
        if (input.left) nextX -= speed;
        if (input.right) nextX += speed;

        obstacles.forEach(obs => {
            if (obs.hp > 0) {
                const dist = Math.hypot(nextX - obs.x, nextY - obs.y);
                if (dist < obs.r + 20) {
                    const angle = Math.atan2(nextY - obs.y, nextX - obs.x);
                    nextX = obs.x + Math.cos(angle) * (obs.r + 20);
                    nextY = obs.y + Math.sin(angle) * (obs.r + 20);
                }
            }
        });

        localPlayer.x = Math.max(30, Math.min(2000, nextX));
        localPlayer.y = Math.max(30, Math.min(1200, nextY));
        localPlayer.angle = input.angle;
    }

    function processLocalMovement() {
        const latestState = getLatestServerPlayerState(myId);
        if (!myId || !latestState || latestState.hp <= 0) return;

        inputSequence++;
        const input = {
            seq: inputSequence,
            up: keys['w'] || keys['arrowup'],
            down: keys['s'] || keys['arrowdown'],
            left: keys['a'] || keys['arrowleft'],
            right: keys['d'] || keys['arrowright'],
            angle: Math.atan2(mouse.y - localPlayer.y, mouse.x - localPlayer.x)
        };

        // 1. Predict Movement Locally
        applyInputToLocalPlayer(input);

        // 2. Queue for Server Reconciliation
        pendingInputs.push(input);

        // 3. Send Input to Server
        socket.emit('playerInput', input);
    }

    // Helper: Return interpolated positions for opponents from server snapshots
    function getInterpolatedOpponent(id, renderTime) {
        if (stateBuffer.length < 2) return null;

        for (let i = stateBuffer.length - 1; i >= 1; i--) {
            const curr = stateBuffer[i];
            const prev = stateBuffer[i - 1];

            if (prev.timestamp <= renderTime && renderTime <= curr.timestamp) {
                const p0 = prev.players[id];
                const p1 = curr.players[id];
                if (!p0 || !p1) return p1 || p0;

                const ratio = (renderTime - prev.timestamp) / (curr.timestamp - prev.timestamp);
                return {
                    ...p1,
                    x: p0.x + (p1.x - p0.x) * ratio,
                    y: p0.y + (p1.y - p0.y) * ratio,
                    angle: p0.angle + (p1.angle - p0.angle) * ratio
                };
            }
        }
        return stateBuffer[stateBuffer.length - 1].players[id];
    }

    function getLatestServerPlayerState(id) {
        if (stateBuffer.length === 0) return null;
        return stateBuffer[stateBuffer.length - 1].players[id];
    }

    function drawSpaceship(x, y, angle, color, hp, shieldActive, speedActive) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        ctx.fillStyle = speedActive ? '#00f0ff' : '#ff5500';
        ctx.beginPath();
        ctx.moveTo(-20, -5); ctx.lineTo(-30 - Math.random() * 10, 0); ctx.lineTo(-20, 5);
        ctx.fill();

        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(22, 0); ctx.lineTo(-16, -16); ctx.lineTo(-8, 0); ctx.lineTo(-16, 16);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        if (shieldActive) {
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, 28, 0, Math.PI * 2);
            ctx.stroke();
        }

        if (hp > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(x - 25, y - 32, 50, 5);
            ctx.fillStyle = color;
            ctx.fillRect(x - 25, y - 32, (hp / 100) * 50, 5);
        }
    }

    function updateLocalBullets() {
        Object.keys(localBullets).forEach(id => {
            const b = localBullets[id];
            b.x += b.vx;
            b.y += b.vy;
            b.life--;
            if (b.life <= 0) delete localBullets[id];
        });
    }

    function render() {
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            screenShake *= 0.85;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Grid Background
        ctx.strokeStyle = 'rgba(30, 41, 59, 0.3)';
        for (let x = 0; x < canvas.width; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 60) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // Obstacles
        obstacles.forEach(obs => {
            if (obs.hp > 0) {
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(obs.x - 20, obs.y - obs.r - 12, 40, 4);
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(obs.x - 20, obs.y - obs.r - 12, (obs.hp / obs.maxHp) * 40, 4);
            }
        });

        // Power-Ups
        powerups.forEach(p => {
            ctx.fillStyle = p.type === 'TRIPLE' ? '#ffcc00' : p.type === 'SPEED' ? '#00ff66' : '#00f0ff';
            ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2); ctx.fill();
        });

        // Particles
        particles.forEach((part, i) => {
            part.x += part.vx; part.y += part.vy; part.life--;
            ctx.fillStyle = part.color;
            ctx.beginPath(); ctx.arc(part.x, part.y, 3, 0, Math.PI * 2); ctx.fill();
            if (part.life <= 0) particles.splice(i, 1);
        });

        // Render Local & Synchronized Remote Bullets
        Object.values(localBullets).forEach(b => {
            ctx.fillStyle = b.color;
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
        });

        // Render Opponents with Entity Interpolation
        const renderTime = Date.now() - INTERPOLATION_OFFSET_MS;
        const latestSnapshot = stateBuffer.length > 0 ? stateBuffer[stateBuffer.length - 1] : null;

        if (latestSnapshot) {
            Object.keys(latestSnapshot.players).forEach(id => {
                if (id !== myId) {
                    const interpolatedOpponent = getInterpolatedOpponent(id, renderTime);
                    if (interpolatedOpponent && interpolatedOpponent.hp > 0) {
                        drawSpaceship(
                            interpolatedOpponent.x,
                            interpolatedOpponent.y,
                            interpolatedOpponent.angle,
                            interpolatedOpponent.color,
                            interpolatedOpponent.hp,
                            interpolatedOpponent.shieldTimer > Date.now(),
                            interpolatedOpponent.speedTimer > Date.now()
                        );
                    }
                }
            });
        }

        // Render Local Predictive Ship
        const localState = getLatestServerPlayerState(myId);
        if (myId && localState && localState.hp > 0) {
            drawSpaceship(
                localPlayer.x,
                localPlayer.y,
                localPlayer.angle,
                localState.color,
                localState.hp,
                localState.shieldTimer > Date.now(),
                localState.speedTimer > Date.now()
            );
        }

        ctx.restore();
    }

    function updateScoreboard(players) {
        if (!players) return;
        const container = document.getElementById('scores');
        container.innerHTML = '';
        Object.values(players).forEach((p, idx) => {
            const row = document.createElement('div');
            row.className = 'score-row';
            row.style.color = p.color;
            row.innerHTML = `<span>PILOT ${idx + 1}</span> <span>${p.kills} K / ${p.deaths} D</span>`;
            container.appendChild(row);
        });
    }

    function loop() {
        processLocalMovement();
        updateLocalBullets();
        render();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
